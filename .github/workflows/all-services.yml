name: RideLink CI

on:
  push:
    paths:
      - 'account-service/**'
      - 'driver-vehicle-service/**'
      - 'ride-management-service/**'
      - 'fare-payment-service/**'
      - '.github/workflows/all-services.yml'
  pull_request:
    paths:
      - 'account-service/**'
      - 'driver-vehicle-service/**'
      - 'ride-management-service/**'
      - 'fare-payment-service/**'
      - '.github/workflows/all-services.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - driver-vehicle-service
          - ride-management-service
          - fare-payment-service

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_MONGODB_URI: mongodb://127.0.0.1:27017/ridelink_accounts_ci
      DRIVER_MONGODB_URI: mongodb://127.0.0.1:27017/ridelink_drivers_ci
      RIDE_MONGODB_URI: mongodb://127.0.0.1:27017/ridelink_rides_ci
      PAYMENT_MONGODB_URI: mongodb://127.0.0.1:27017/ridelink_payments_ci
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ACCOUNT_ADMIN_EMAIL: ci-admin@example.com
      ACCOUNT_ADMIN_PASSWORD: CI-Only-AdminPass123!
      ACCOUNT_SERVICE_BASE_URL: http://localhost:8081
      DRIVER_SERVICE_BASE_URL: http://localhost:8082
      RIDE_SERVICE_BASE_URL: http://localhost:8083

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 and cache Maven dependencies
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and run tests
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
